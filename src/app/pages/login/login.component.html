<div class="login-container">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">

    <h1>Acesso ao PDV</h1>
    <p class="subtitle">Entre para acessar o caixa</p>

    <input
      type="email"
      placeholder="Email"
      formControlName="email"
    />

    <small *ngIf="form.controls.email.touched && form.controls.email.invalid" class="error-text">
    Atenção: informe um e-mail válido
    </small>

    <input
      type="password"
      placeholder="Senha"
      formControlName="password"
    />

    <button type="submit">Entrar</button>

    <div *ngIf="loginError" class="login-error-alert">
      ⚠️ {{ loginError }}
    </div>


  </form>
</div>
